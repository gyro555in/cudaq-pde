[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cudaq-pde"
version = "0.1.0"
description = "Quantum PDE solvers on CUDA-Q (gate-level reference implementations)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
cu12 = ["cuda-quantum-cu12>=0.16,<0.17"]
cu13 = ["cuda-quantum-cu13>=0.16,<0.17"]
dev = ["pytest", "ruff", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a GPU target; skipped unless --run-gpu is given"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
